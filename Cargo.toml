[package]
name = "sheetbrief"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace]
members = [".", "mcp-server"]
resolver = "2"

[dependencies]
rxls = { version = "=0.1.3", default-features = false, features = ["full"] }
rwml = "=0.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
