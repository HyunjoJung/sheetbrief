[package]
name = "sheetbrief-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[dependencies]
sheetbrief = { path = ".." }
axum = "0.8"
base64 = "0.23"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "=3.2.0", features = ["transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "=3.2.0", features = ["client", "transport-streamable-http-client-reqwest"] }
rwml = "=0.1.4"
